# Render blueprint for the backend API. Secrets are set in the Render dashboard, not here.
services:
  - type: web
    name: paypal-shopping-agent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.7-flash
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Frontend: static site (no cold start). Set VITE_API_BASE_URL in the dashboard to the API service's public URL,
  # then set the API's FRONTEND_URL and CORS_ORIGINS to this site's URL.
  - type: web
    name: paypal-shopping-agent-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx vite build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCKS
        value: "false"
